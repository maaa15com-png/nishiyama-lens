services:
  db:
    image: postgres:17
    container_name: nishiyama-lens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nishiyama_lens
    ports:
      - "5432:5432"
    volumes:
      - nishiyama_lens_pgdata:/var/lib/postgresql/data

volumes:
  nishiyama_lens_pgdata:
  